name: Release production version

on:
  pull_request:
    types: [closed]
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-plugin:
    name: Build with Node
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release//')
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Create .env.local file
      run: |
        touch .env.local
        echo VITE_SUPABASE_URL="$" >> .env.local
        echo VITE_SUPABASE_PUBLIC_ANON_KEY="$" >> .env.local
        echo VITE_SENTRY_DSN="$" >> .env.local
        echo VITE_MIXPANEL_TOKEN="$" >> .env.local
        echo VITE_AUTH_WORKER_URL="$" >> .env.local
        echo VITE_AUTH_URL="$" >> .env.local
        echo VITE_ANNOUNCEMENTS_WORKER_URL="$" >> .env.local
        echo VITE_CORS_WORKER_URL="$" >> .env.local
        echo VITE_NOTION_ANNOUNCEMENTS_ID="$" >> .env.local
        echo VITE_NOTION_ONBOARDING_ID="$" >> .env.local
        echo VITE_NOTION_API_KEY="$" >> .env.local
        echo VITE_LEMONSQUEEZY_URL="$" >> .env.local
        echo VITE_LEMONSQUEEZY_API_KEY="$" >> .env.local
        echo VITE_TOLGEE_URL="$" >> .env.local
        echo VITE_TOLGEE_API_KEY="$" >> .env.local
        cat .env.local
        touch .env.sentry-build-plugin
        echo SENTRY_ORG="$" >> .env.sentry-build-plugin
        echo SENTRY_PROJECT="$" >> .env.sentry-build-plugin
        echo SENTRY_AUTH_TOKEN="$" >> .env.sentry-build-plugin
        echo SENTRY_AUTH_TOKEN="$" >> .env.sentry-build-plugin
        cat .env.sentry-build-plugin

    - name: Install and Build
      run: |
        npm ci
        npm run build:prod
        
    - name: Archive /figma production artifact
      uses: actions/upload-artifact@v4
      with:
        name: '-figma-plugin'
        path: |
          dist/index.html
          dist/plugin.js
          manifest.json
        retention-days: 5
        
  create-release:
    name: Create release
    needs: build-plugin
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release//')
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: '-figma-plugin'
        path: ./-figma-plugin

    - name: Zip /figma plugin
      run: |
        # Simply zip the downloaded artifact directory
        zip -r -figma-plugin.zip ./-figma-plugin
        # Verify zip contents
        unzip -l -figma-plugin.zip

    - name: Extract package version
      id: extract_version
      run: |
        package_version=$(jq -r '.version' package.json)
        echo "package_version=$package_version" >> $GITHUB_OUTPUT

    - name: Remove dots from version
      id: remove_dot_version
      run: |
        version_nopoint=$(echo "$" | tr -d '.')
        echo "version_nopoint=$version_nopoint" >> $GITHUB_OUTPUT

    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: $
      with:
        tag_name: v$
        release_name: $
        body: |
          ## What's Changed
          [Friendly release note](https://ui-color-palette.canny.io/changelog/ui-color-palette-$)

    - name: Upload plugin as release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: $
      with:
        upload_url: $
        asset_path: '-figma-plugin.zip'
        asset_name: '-figma-plugin.zip'
        asset_content_type: application/zip
