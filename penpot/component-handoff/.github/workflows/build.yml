name: Build and Download Component Handoff

on: workflow_dispatch

jobs:
  build-plugin:
    name: Build with Node
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Create .env.local file
      run: |
        touch .env.local
        echo VITE_SUPABASE_URL="$" >> .env.local
        echo VITE_SUPABASE_PUBLIC_ANON_KEY="$" >> .env.local
        echo VITE_SENTRY_DSN="$" >> .env.local
        echo VITE_MIXPANEL_TOKEN="$" >> .env.local
        echo VITE_AUTH_WORKER_URL="$" >> .env.local
        echo VITE_AUTH_URL="$" >> .env.local
        echo VITE_ANNOUNCEMENTS_WORKER_URL="$" >> .env.local
        echo VITE_CORS_WORKER_URL="$" >> .env.local
        echo VITE_NOTION_ANNOUNCEMENTS_ID="$" >> .env.local
        echo VITE_NOTION_ONBOARDING_ID="$" >> .env.local
        echo VITE_NOTION_API_KEY="$" >> .env.local
        echo VITE_LEMONSQUEEZY_URL="$" >> .env.local
        echo VITE_LEMONSQUEEZY_API_KEY="$" >> .env.local
        echo VITE_TOLGEE_URL="$" >> .env.local
        echo VITE_TOLGEE_API_KEY="$" >> .env.local
        cat .env.local
        touch .env.sentry-build-plugin
        echo SENTRY_ORG="$" >> .env.sentry-build-plugin
        echo SENTRY_PROJECT="$" >> .env.sentry-build-plugin
        echo SENTRY_AUTH_TOKEN="$" >> .env.sentry-build-plugin
        cat .env.sentry-build-plugin

    - name: Install and Build
      run: |
        npm ci
        npm run build:prod
        
    - name: Archive production artifact
      uses: actions/upload-artifact@v4
      with:
        name: '-figma-plugin'
        path: |
          dist/index.html
          dist/plugin.js
          dist/manifest.json
        retention-days: 5
