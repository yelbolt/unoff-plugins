name: Build plugins

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Specific plugin to build ("platform/name"). Leave empty to build every plugin changed by this run.'
        required: false

jobs:
  detect:
    name: Detect changed plugins
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-plugins
        with:
          plugin: ${{ github.event.inputs.plugin }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.event.after || '') }}

  build:
    name: Build ${{ matrix.plugin }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create env files
        run: |
          touch "${{ matrix.plugin }}/.env.local" "${{ matrix.plugin }}/.env.sentry-build-plugin"
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLIC_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLIC_ANON_KEY }}"
            echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}"
            echo "VITE_MIXPANEL_TOKEN=${{ secrets.VITE_MIXPANEL_TOKEN }}"
            echo "VITE_AUTH_WORKER_URL=${{ secrets.VITE_AUTH_WORKER_URL }}"
            echo "VITE_AUTH_URL=${{ secrets.VITE_AUTH_URL }}"
            echo "VITE_ANNOUNCEMENTS_WORKER_URL=${{ secrets.VITE_ANNOUNCEMENTS_WORKER_URL }}"
            echo "VITE_CORS_WORKER_URL=${{ secrets.VITE_CORS_WORKER_URL }}"
            echo "VITE_NOTION_ANNOUNCEMENTS_ID=${{ secrets.VITE_NOTION_ANNOUNCEMENTS_ID }}"
            echo "VITE_NOTION_ONBOARDING_ID=${{ secrets.VITE_NOTION_ONBOARDING_ID }}"
            echo "VITE_NOTION_API_KEY=${{ secrets.VITE_NOTION_API_KEY }}"
            echo "VITE_LEMONSQUEEZY_URL=${{ secrets.VITE_LEMONSQUEEZY_URL }}"
            echo "VITE_LEMONSQUEEZY_API_KEY=${{ secrets.VITE_LEMONSQUEEZY_API_KEY }}"
            echo "VITE_TOLGEE_URL=${{ secrets.VITE_TOLGEE_URL }}"
            echo "VITE_TOLGEE_API_KEY=${{ secrets.VITE_TOLGEE_API_KEY }}"
          } >> "${{ matrix.plugin }}/.env.local"
          {
            echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}"
            echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}"
            echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
          } >> "${{ matrix.plugin }}/.env.sentry-build-plugin"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod --workspace="${{ matrix.plugin }}"

      - name: Compute artifact name
        id: meta
        run: echo "slug=$(echo '${{ matrix.plugin }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ steps.meta.outputs.slug }}
          path: |
            dist/${{ matrix.plugin }}/index.html
            dist/${{ matrix.plugin }}/plugin.js
            dist/${{ matrix.plugin }}/manifest.json
          retention-days: 5
