name: Release plugins

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to release: a bare name ("token-lint"), a platform ("penpot"), or "platform/name". Leave empty to release every plugin changed by this run.'
        required: false

jobs:
  detect:
    name: Detect changed plugins
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release//'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-plugins
        with:
          plugin: ${{ github.event.inputs.plugin }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  release:
    name: Release ${{ matrix.plugin.path }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ matrix.plugin.slug }}
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create env files
        run: |
          touch "${{ matrix.plugin.path }}/.env.local" "${{ matrix.plugin.path }}/.env.sentry-build-plugin"
          {
            echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLIC_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLIC_ANON_KEY }}"
            echo "VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}"
            echo "VITE_MIXPANEL_TOKEN=${{ secrets.VITE_MIXPANEL_TOKEN }}"
            echo "VITE_AUTH_WORKER_URL=${{ vars.VITE_AUTH_WORKER_URL }}"
            echo "VITE_AUTH_URL=${{ vars.VITE_AUTH_URL }}"
            echo "VITE_ANNOUNCEMENTS_WORKER_URL=${{ vars.VITE_ANNOUNCEMENTS_WORKER_URL }}"
            echo "VITE_CORS_WORKER_URL=${{ vars.VITE_CORS_WORKER_URL }}"
            echo "VITE_NOTION_ANNOUNCEMENTS_ID=${{ vars.VITE_NOTION_ANNOUNCEMENTS_ID }}"
            echo "VITE_NOTION_ONBOARDING_ID=${{ vars.VITE_NOTION_ONBOARDING_ID }}"
            echo "VITE_NOTION_API_KEY=${{ secrets.VITE_NOTION_API_KEY }}"
            echo "VITE_LEMONSQUEEZY_URL=${{ vars.VITE_LEMONSQUEEZY_URL }}"
            echo "VITE_LEMONSQUEEZY_API_KEY=${{ secrets.VITE_LEMONSQUEEZY_API_KEY }}"
            echo "VITE_TOLGEE_URL=${{ vars.VITE_TOLGEE_URL }}"
            echo "VITE_TOLGEE_API_KEY=${{ secrets.VITE_TOLGEE_API_KEY }}"
          } >> "${{ matrix.plugin.path }}/.env.local"
          {
            echo "SENTRY_ORG=${{ vars.SENTRY_ORG }}"
            echo "SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}"
            echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
          } >> "${{ matrix.plugin.path }}/.env.sentry-build-plugin"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod --workspace="${{ matrix.plugin.path }}"

      - name: Compute release metadata
        id: meta
        run: |
          name=$(basename "${{ matrix.plugin.path }}")
          version=$(jq -r '.version' "${{ matrix.plugin.path }}/package.json")
          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=${{ matrix.plugin.slug }}-v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          entry=$(node scripts/changelog.mjs extract "${{ matrix.plugin.path }}/CHANGELOG.md")
          if [ -z "$entry" ]; then
            entry="_No changelog entries recorded for this release._"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$entry"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Zip plugin
        id: zip
        run: |
          zip_name="${{ steps.meta.outputs.name }}.zip"
          (cd "dist/${{ matrix.plugin.path }}" && zip -r "$GITHUB_WORKSPACE/$zip_name" .)
          unzip -l "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          release_name: ${{ matrix.plugin.path }} v${{ steps.meta.outputs.version }}
          body: |
            ## What's changed
            ${{ steps.changelog.outputs.body }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.zip.outputs.zip_name }}
          asset_name: ${{ steps.zip.outputs.zip_name }}
          asset_content_type: application/zip

      - name: Copy root directory page
        run: cp index.html dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true
          publish_branch: gh-pages

      - name: Bump changelog
        run: node scripts/changelog.mjs bump "${{ matrix.plugin.path }}/CHANGELOG.md" "${{ steps.meta.outputs.version }}"

      - name: Commit changelog bump
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: >-
            chore(${{ matrix.plugin.path }}): bump changelog for
            v${{ steps.meta.outputs.version }} [skip ci]
          file_pattern: ${{ matrix.plugin.path }}/CHANGELOG.md
          branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
