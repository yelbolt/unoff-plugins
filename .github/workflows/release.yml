name: Release plugins

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Specific plugin to release ("platform/name"). Leave empty to release every plugin changed by this run.'
        required: false

jobs:
  detect:
    name: Detect changed plugins
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release//'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-plugins
        with:
          plugin: ${{ github.event.inputs.plugin }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  release:
    name: Release ${{ matrix.plugin }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create env files
        run: |
          touch "${{ matrix.plugin }}/.env.local" "${{ matrix.plugin }}/.env.sentry-build-plugin"
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLIC_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLIC_ANON_KEY }}"
            echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}"
            echo "VITE_MIXPANEL_TOKEN=${{ secrets.VITE_MIXPANEL_TOKEN }}"
            echo "VITE_AUTH_WORKER_URL=${{ secrets.VITE_AUTH_WORKER_URL }}"
            echo "VITE_AUTH_URL=${{ secrets.VITE_AUTH_URL }}"
            echo "VITE_ANNOUNCEMENTS_WORKER_URL=${{ secrets.VITE_ANNOUNCEMENTS_WORKER_URL }}"
            echo "VITE_CORS_WORKER_URL=${{ secrets.VITE_CORS_WORKER_URL }}"
            echo "VITE_NOTION_ANNOUNCEMENTS_ID=${{ secrets.VITE_NOTION_ANNOUNCEMENTS_ID }}"
            echo "VITE_NOTION_ONBOARDING_ID=${{ secrets.VITE_NOTION_ONBOARDING_ID }}"
            echo "VITE_NOTION_API_KEY=${{ secrets.VITE_NOTION_API_KEY }}"
            echo "VITE_LEMONSQUEEZY_URL=${{ secrets.VITE_LEMONSQUEEZY_URL }}"
            echo "VITE_LEMONSQUEEZY_API_KEY=${{ secrets.VITE_LEMONSQUEEZY_API_KEY }}"
            echo "VITE_TOLGEE_URL=${{ secrets.VITE_TOLGEE_URL }}"
            echo "VITE_TOLGEE_API_KEY=${{ secrets.VITE_TOLGEE_API_KEY }}"
          } >> "${{ matrix.plugin }}/.env.local"
          {
            echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}"
            echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}"
            echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
          } >> "${{ matrix.plugin }}/.env.sentry-build-plugin"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod --workspace="${{ matrix.plugin }}"

      - name: Compute release metadata
        id: meta
        run: |
          name=$(basename "${{ matrix.plugin }}")
          platform=$(dirname "${{ matrix.plugin }}")
          version=$(jq -r '.version' "${{ matrix.plugin }}/package.json")
          {
            echo "name=$name"
            echo "platform=$platform"
            echo "version=$version"
            echo "tag=${platform}-${name}-v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Zip plugin
        id: zip
        run: |
          zip_name="${{ steps.meta.outputs.name }}.zip"
          (cd "dist/${{ matrix.plugin }}" && zip -r "$GITHUB_WORKSPACE/$zip_name" .)
          unzip -l "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          release_name: ${{ matrix.plugin }} v${{ steps.meta.outputs.version }}
          body: |
            ## What's changed
            Release of `${{ matrix.plugin }}` version ${{ steps.meta.outputs.version }}.

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.zip.outputs.zip_name }}
          asset_name: ${{ steps.zip.outputs.zip_name }}
          asset_content_type: application/zip

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Each plugin's vite.config.ts already builds into dist/<platform>/<name>/,
          # so publishing the whole dist/ tree from this job (which only ever
          # contains the one plugin just built) lands it at the matching path
          # on gh-pages. keep_files: true stops this from wiping every other
          # plugin already published there.
          publish_dir: dist
          keep_files: true
          publish_branch: gh-pages
